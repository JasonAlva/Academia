services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────────
  - type: web
    name: dbms-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dbms-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true        # Render auto-generates a secure 32-char value
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: GOOGLE_API_KEY
        sync: false                # Paste your Google AI Studio key in Render dashboard
                                   # (optional — users can also add their own key via Profile → AI Settings)
      - key: FRONTEND_URL
        sync: false                # After first deploy, paste the Render frontend URL here
                                   # e.g. https://dbms-frontend.onrender.com

  # ── Frontend (React/Vite → nginx) ─────────────────────────────────────
  - type: web
    name: dbms-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # Render passes this env var into `docker build --build-arg VITE_API_URL=...`
      # because the Dockerfile declares `ARG VITE_API_URL`.
      # After first deploy, set this to your backend URL + /api:
      #   e.g. https://dbms-backend.onrender.com/api
      - key: VITE_API_URL
        sync: false

# ── PostgreSQL Database ────────────────────────────────────────────────
databases:
  - name: dbms-postgres
    databaseName: college_query_system
   
